[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loca-py"
version = "0.1.0"
description = "Local GGUF Streamlit assistant for text generation, retrieval, and data management"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "Terry Eppler"}]
license = "MIT"
license-files = ["LICENSE.txt"]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/is-leeroy-jenkins/loca"
Documentation = "https://is-leeroy-jenkins.github.io/loca/"
Issues = "https://github.com/is-leeroy-jenkins/loca/issues"

[project.scripts]
loca = "loca.cli:desktop"
loca-browser = "loca.cli:main"

[tool.setuptools]
packages = ["loca"]
package-dir = {loca = "."}
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-runtime.txt"]}

[tool.setuptools.package-data]
loca = ["resources/**/*.png", "resources/**/*.ico", ".streamlit/config.toml"]

